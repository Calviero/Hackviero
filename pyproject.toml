[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackviero"
dynamic = ["version"]
description = "Toolkit de ciberseguridad para la terminal: puertos, DNS, TLS, cabeceras, hashes y más, con interfaz hecha con rich."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ciberseguridad", "cybersecurity", "pentesting", "kali", "recon", "cli", "rich", "ctf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hackviero = "hackviero:main"

[tool.setuptools]
py-modules = ["hackviero"]

[tool.setuptools.dynamic]
version = { attr = "hackviero.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
